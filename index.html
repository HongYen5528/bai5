<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Danh sách công việc</title>
<style>
body{font-family:Arial;background:#fff7ed;display:grid;place-items:center;min-height:100vh;margin:0}
main{background:white;padding:28px;border-radius:16px;width:min(430px,88vw);box-shadow:0 8px 25px #0001}
h1{text-align:center;color:#9a3412}form{display:flex;gap:8px}input{min-width:0;flex:1;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
button{padding:10px 13px;border:0;border-radius:8px;background:#ea580c;color:white;cursor:pointer}
ul{padding:0;list-style:none}li{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eee}
li span{flex:1;overflow-wrap:anywhere}.done{text-decoration:line-through;color:#888}
.delete{background:#dc2626}
</style></head><body><main><h1>Việc cần làm</h1>
<form id="todoForm"><input id="taskInput" placeholder="Nhập công việc..." autocomplete="off"><button type="submit">Thêm</button></form>
<ul id="taskList"></ul>
<script>
const form=document.getElementById('todoForm'),input=document.getElementById('taskInput'),list=document.getElementById('taskList');
form.addEventListener('submit',function(event){
 event.preventDefault();const task=input.value.trim();if(!task)return;
 const li=document.createElement('li'),check=document.createElement('input'),span=document.createElement('span'),del=document.createElement('button');
 check.type='checkbox';span.textContent=task;del.textContent='Xóa';del.className='delete';
 check.addEventListener('change',()=>span.classList.toggle('done',check.checked));
 del.addEventListener('click',()=>li.remove());
 li.append(check,span,del);list.appendChild(li);input.value='';input.focus();
});
</script></main></body></html>
